name: Publish Lynx Preview
run-name: Publish SmartUI ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Lynx prerelease version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-smart-ui-lynx-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - name: Validate release
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./package.json');
          assert.equal(p.name, '@ray-js/smart-ui');
          assert.equal(p.version, process.env.RELEASE_VERSION);
          assert.match(p.version, /^\d+\.\d+\.\d+-lynx\.\d+$/);
          NODE
      - name: Verify the locally built archive
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const pack = require('./.release/manifest.json');
          assert.equal(pack.name, '@ray-js/smart-ui');
          assert.equal(pack.version, process.env.RELEASE_VERSION);
          const tarball = './.release/' + pack.filename;
          assert.equal(crypto.createHash('sha256').update(fs.readFileSync(tarball)).digest('hex'), pack.sha256);
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TARBALL=${tarball}\nRELEASE_INTEGRITY=${pack.integrity}\n`);
          NODE
          mkdir -p "$RUNNER_TEMP/smart-ui-check"
          RELEASE_TARBALL=$(node -p "'./.release/' + require('./.release/manifest.json').filename")
          tar -xzf "$RELEASE_TARBALL" -C "$RUNNER_TEMP/smart-ui-check"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'smart-ui-check/package');
          const pkg = require(path.join(root, 'package.json'));
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          assert.equal(pkg.dependencies['@tuya/miniapp-smart-ui'], '2.13.7-lynx.0');
          assert.equal(pkg.dependencies['@ray-js/components-ty-slider'], '0.3.10-beta.4');
          for (const file of ['es/index.js','lib/index.js','config.cjs','config.d.ts','components.json','page-hosts.json','webview/es/switch/index.js','lynx/es/switch/index.js']) {
            assert.ok(fs.existsSync(path.join(root, file)), `Missing archive entry: ${file}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: smart-ui-${{ inputs.version }}
          path: .release/
          include-hidden-files: true
          retention-days: 30
      - name: Publish Lynx preview
        run: npm publish "$RELEASE_TARBALL" --ignore-scripts --access public --tag lynx
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public version and integrity
        run: |
          for attempt in {1..60}; do
            actual=$(npm view "@ray-js/smart-ui@${RELEASE_VERSION}" dist.integrity --registry=https://registry.npmjs.org/ --prefer-online 2>/dev/null || true)
            if [ "$actual" = "$RELEASE_INTEGRITY" ]; then
              echo "Verified @ray-js/smart-ui@${RELEASE_VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo 'Published version is not yet visible in the registry'
          exit 1

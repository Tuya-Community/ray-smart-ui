name: Publish Lynx Preview
run-name: Publish SmartUI ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Lynx prerelease version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-smart-ui-lynx-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          registry-url: https://registry.npmjs.org/
      - name: Validate release
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./package.json');
          assert.equal(p.name, '@ray-js/smart-ui');
          assert.equal(p.version, process.env.RELEASE_VERSION);
          assert.match(p.version, /^\d+\.\d+\.\d+-lynx\.\d+$/);
          NODE
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build and verify package
        run: yarn build
      - name: Run regression tests
        run: yarn test
      - name: Pack verified package
        run: |
          mkdir -p release-output
          npm pack --json --pack-destination release-output > release-output/pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const [pack] = require('./release-output/pack.json');
          assert.equal(pack.name, '@ray-js/smart-ui');
          assert.equal(pack.version, process.env.RELEASE_VERSION);
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TARBALL=./release-output/${pack.filename}\nRELEASE_INTEGRITY=${pack.integrity}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: smart-ui-${{ inputs.version }}
          path: release-output/
          retention-days: 30
      - name: Publish Lynx preview
        run: npm publish "$RELEASE_TARBALL" --ignore-scripts --access public --tag lynx
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public version and integrity
        run: |
          for attempt in {1..60}; do
            actual=$(npm view "@ray-js/smart-ui@${RELEASE_VERSION}" dist.integrity --registry=https://registry.npmjs.org/ --prefer-online 2>/dev/null || true)
            if [ "$actual" = "$RELEASE_INTEGRITY" ]; then
              echo "Verified @ray-js/smart-ui@${RELEASE_VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo 'Published version is not yet visible in the registry'
          exit 1
